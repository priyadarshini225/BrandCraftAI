<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandCraft AI</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Spline full-screen background ── */
    .spline-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .spline-bg iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── CTA overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 9vh;
      pointer-events: none;
    }

    .cta-btn {
      pointer-events: all;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 17px 44px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      color: #fff;
      background: linear-gradient(135deg, #7B5CF0 0%, #EC4899 100%);
      box-shadow:
        0 0 0 1px rgba(123,92,240,0.35),
        0 8px 32px rgba(123,92,240,0.45),
        0 2px 8px rgba(0,0,0,0.4);
      text-decoration: none;
      /* glow pulse */
      animation: glow-pulse 2.8s ease-in-out infinite;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .cta-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 0 0 1px rgba(123,92,240,0.5),
        0 14px 44px rgba(123,92,240,0.6),
        0 4px 12px rgba(0,0,0,0.5);
    }

    .cta-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* arrow icon */
    .cta-btn svg {
      transition: transform 0.18s ease;
    }
    .cta-btn:hover svg {
      transform: translateX(4px);
    }

    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(123,92,240,0.35), 0 8px 32px rgba(123,92,240,0.45), 0 2px 8px rgba(0,0,0,0.4); }
      50%       { box-shadow: 0 0 0 1px rgba(236,72,153,0.45), 0 12px 48px rgba(236,72,153,0.55), 0 2px 8px rgba(0,0,0,0.4); }
    }
  </style>
</head>
<body>

  <!-- Spline 3D scene -->
  <div class="spline-bg">
    <iframe
      src="https://my.spline.design/100followers-u1x4skoVnuAGaEOLs7p5GvPd/"
      frameborder="0"
      width="100%"
      height="100%"
      loading="eager"
      allowfullscreen
    ></iframe>
  </div>

  <!-- Enter button -->
  <div class="overlay">
    <a class="cta-btn" href="index.html" onclick="sessionStorage.setItem('_bc_landed','1')">
      Enter Dashboard
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

</body>
</html>
